x-backend-environment: &backend-environment
  NODE_ENV: production
  DATA_STORE: postgres
  DATABASE_URL: postgresql://ecoscan:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ecoscan
  RATE_LIMIT_HASH_KEY: ${RATE_LIMIT_HASH_KEY:?Set RATE_LIMIT_HASH_KEY}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
  VISION_PROVIDER: ${VISION_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-6-luna}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}

x-backend-image: &backend-image
  image: ecoscan-api:local
  build:
    context: .
    dockerfile: Dockerfile.api
  environment: *backend-environment
  init: true
  stop_grace_period: 35s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecoscan
      POSTGRES_USER: ecoscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ecoscan_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 35s

  migrate:
    <<: *backend-image
    command: ["node", "--import", "tsx", "src/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  worker:
    <<: *backend-image
    command: ["node", "--import", "tsx", "src/worker.ts"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  ecoscan_prod_data:
