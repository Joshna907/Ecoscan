name: Release checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecoscan
          POSTGRES_PASSWORD: ecoscan
          POSTGRES_DB: ecoscan_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ecoscan:ecoscan@localhost:5432/ecoscan_test
      TEST_DATABASE_URL: postgresql://ecoscan:ecoscan@localhost:5432/ecoscan_test
      RATE_LIMIT_HASH_KEY: ci-only-rate-limit-key-not-for-deployment
      VISION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w api
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web
      - run: npm run lint -w web
      - run: npm run build:web
      - run: npm run release:check -w api
