services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecoscan
      POSTGRES_USER: ecoscan
      POSTGRES_PASSWORD: ecoscan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ecoscan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoscan -d ecoscan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecoscan_pgdata:
